name: Build Mod

on: [push]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up PATH
        run: |
          echo "${ANDROID_HOME}/build-tools/36.1.0" >> $GITHUB_PATH
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'
      - name: Build mod jar
        run: ./gradlew :ui:deploy -PverSuffix=${{startsWith(github.ref, 'refs/tags/') && github.ref_name || github.run_number}}
      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: Ui
          path: ui/build/libs/ui.jar
      - name: Upload as release
        if: ${{startsWith(github.ref, 'refs/tags/')}}
        uses: svenstaro/upload-release-action@v2
        with:
          release_name: ${{github.ref_name}}
          file: ui/build/libs/ui.jar